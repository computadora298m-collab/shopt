<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda online</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .store-name-animated {
            display: inline-block;
            color: transparent;
            background: linear-gradient(110deg, #0f172a 18%, #4f46e5 42%, #a5b4fc 50%, #0f172a 78%);
            background-size: 220% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: store-name-shimmer 5s ease-in-out infinite;
        }

        .customer-menu-panel {
            animation: customer-menu-entrance 180ms ease-out;
        }

        @keyframes store-name-shimmer {
            0%, 100% { background-position: 100% 50%; }
            50% { background-position: 0 50%; }
        }

        @keyframes customer-menu-entrance {
            from { opacity: 0; transform: translateY(-0.4rem) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .store-name-animated,
            .customer-menu-panel {
                animation: none;
            }
        }

        @media print {
            body > :not(#print-receipt) {
                display: none !important;
            }
            #print-receipt {
                display: block !important;
                color: #111827;
                font-family: Arial, sans-serif;
                padding: 24px;
            }
        }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col justify-between">

    <div id="app" class="min-h-full flex flex-col">
        <!-- Contenedor dinámico principal controlado por JS -->
    </div>

    <!-- AI Shopping Assistant Floating Widget -->
    <div id="ai-assistant-container" class="fixed bottom-6 right-6 z-50">
        <!-- Chat Window -->
        <div id="ai-chat-window" class="hidden w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col h-[480px] mb-4 overflow-hidden fade-in">
            <div class="ai-chat-header bg-gradient-to-r from-brand-600 to-indigo-700 text-white p-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="assistant-brand-icon w-8 h-8 rounded-full bg-white/20 flex items-center justify-center">
                        <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
                    </div>
                    <div>
                        <h4 class="font-bold text-sm">Asistente IA</h4>
                        <p class="text-[10px] text-indigo-100">Asistente de compras</p>
                    </div>
                </div>
                <button onclick="toggleAiChat()" class="text-white/80 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="ai-chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50 text-sm">
                <p id="ai-chat-empty-state" class="py-8 text-center text-xs text-slate-400">Escribe tu pregunta para iniciar la conversación.</p>
            </div>
            <form id="ai-chat-form" class="p-3 bg-white border-t border-slate-200 flex gap-2">
                <input type="text" id="ai-chat-input" maxlength="2000" required placeholder="Escribe tu pregunta para comenzar..." class="flex-1 px-3 py-2 rounded-xl border border-slate-300 text-xs focus:ring-2 focus:ring-brand-500 outline-none">
                <button type="submit" id="ai-chat-submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 disabled:opacity-50 text-white rounded-xl text-xs font-semibold shadow-md transition" aria-label="Enviar mensaje">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
        <!-- Toggle Button -->
        <button id="ai-chat-toggle" onclick="toggleAiChat()" class="w-14 h-14 rounded-full bg-gradient-to-r from-brand-600 to-indigo-700 text-white shadow-xl hover:scale-105 transition flex items-center justify-center text-xl relative group">
            <i class="assistant-toggle-icon fa-solid fa-wand-magic-sparkles"></i>
            <span class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full border-2 border-white"></span>
        </button>
    </div>

    <!-- Modal Global de Inicio de Sesión / Selección de Rol -->
    <div id="login-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
        <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl border border-slate-200 p-8 fade-in relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>

            <div class="text-center mb-6">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-brand-600 text-white shadow-lg shadow-brand-500/30 mb-3">
                    <i class="fa-solid fa-right-to-bracket text-xl"></i>
                </div>
                <h3 class="text-2xl font-bold text-slate-900">Iniciar Sesión</h3>
                <p class="text-xs text-slate-500 mt-1">Clientes: continúa con Google; la primera vez tu cuenta se registra automáticamente. Personal: usa tus credenciales.</p>
            </div>

            <div class="relative flex py-2 items-center mb-4">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-[10px] font-semibold text-slate-400 uppercase">Credenciales de Acceso</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <form id="modal-login-form" class="space-y-4" autocomplete="off">
                <div>
                    <label class="block text-xs font-medium text-slate-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="login-email" required autocomplete="off" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-xs transition" placeholder="nombre@correo.com">
                </div>
                <div id="login-dni-field" class="hidden">
                    <label class="block text-xs font-medium text-slate-700 mb-1">D.N.I.</label>
                    <input type="text" id="login-dni" autocomplete="off" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-xs transition" placeholder="Número de D.N.I.">
                </div>
                <div id="login-pass-field" class="hidden">
                    <label class="block text-xs font-medium text-slate-700 mb-1">Contraseña</label>
                    <input type="password" id="login-pass" autocomplete="off" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none text-xs transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full py-3 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-600/30 transition text-xs">
                    Confirmar e Ingresar
                </button>
            </form>
            <div id="google-login-container" class="mt-4">
                <div id="google-signin-button" class="flex justify-center"></div>
            </div>
        </div>
    </div>

    <!-- Modal Global de Alertas / Notificaciones -->
    <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div id="toast-content" class="bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3 text-sm font-medium border border-slate-700">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
            <span id="toast-message">Notificación del sistema</span>
        </div>
    </div>

    <div id="print-receipt" class="hidden"></div>

    <script src="js/app.js"></script>
    <script src="js/assistant.js"></script>
</body>
</html>
